<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream | {filename}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        /* Dark Anime Gradient Background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Glassmorphism Container */
        .glass-container {
            width: 90%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Header / Title */
        .header {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e0e0e0;
            word-wrap: break-word;
            margin: 0;
        }

        /* Player Wrapper to make it look sleek */
        .player-wrapper {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            /* Plyr Custom Theme Color (Neon Pink/Red) */
            --plyr-color-main: #ff007f; 
        }

        /* Footer Info & Download Button */
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .expire-text {
            font-size: 0.9rem;
            color: #ff4b4b;
            background: rgba(255, 75, 75, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            margin: 0;
        }

        .download-btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
        }

        @media (max-width: 600px) {
            .footer {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="header">
            <h1 class="title">🎬 {filename}</h1>
        </div>

        <div class="player-wrapper">
            <video id="anime-player" playsinline controls>
                <source src="/stream/{token}" type="video/mp4" />
            </video>
        </div>

        <div class="footer">
            <p class="expire-text">⚠️ Link expires in 24 Hours</p>
            <a href="/stream/{token}" class="download-btn" download>⬇️ Download File</a>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const player = new Plyr('#anime-player', {
                controls: [
                    'play-large', // The large play button in the center
                    'play', // Play/pause playback
                    'progress', // The progress bar and scrubber for playback and buffering
                    'current-time', // The current time of playback
                    'duration', // The full duration of the media
                    'mute', // Toggle mute
                    'volume', // Volume control
                    'captions', // Toggle captions
                    'settings', // Settings menu
                    'pip', // Picture-in-picture (currently Safari only)
                    'airplay', // Airplay (currently Safari only)
                    'fullscreen' // Toggle fullscreen
                ],
                settings: ['captions', 'quality', 'speed'],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
            });

            // 🔥 Auto-Resume Feature: Yaad rakhega kahan chhoda tha
            const videoKey = 'resume_time_{token}';
            
            player.on('ready', () => {
                const savedTime = localStorage.getItem(videoKey);
                if (savedTime) {
                    player.currentTime = parseFloat(savedTime);
                }
            });

            player.on('timeupdate', () => {
                localStorage.setItem(videoKey, player.currentTime);
            });
        });
    </script>
</body>
</html>
